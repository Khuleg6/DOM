<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Hanuman:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=LINE+Seed+JP&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Shadows+Into+Light&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="main">
      <div class="sec1">
        <input class="input" type="text" id="input" />
      </div>
      <div class="sec2">
        <div class="btn b1" id="backspace">
          <svg
            class="delete"
            xmlns="http://www.w3.org/2000/svg"
            height="54px"
            viewBox="0 -960 960 960"
            width="54px"
            fill="#fff"
          >
            <path
              d="m456-320 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 160q-19 0-36-8.5T296-192L80-480l216-288q11-15 28-23.5t36-8.5h440q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H360ZM180-480l180 240h440v-480H360L180-480Zm400 0Z"
            />
          </svg>
        </div>
        <div class="btn b1" id="clear">C</div>
        <div class="btn b1" id="percentage">%</div>
        <div class="btn b2" id="divide">
          <svg
            class="divide"
            xmlns="http://www.w3.org/2000/svg"
            width="54px"
            height="54px"
            viewBox="0 0 24 24"
            fill="#fff"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-divide"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M11 6a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" fill="currentColor" />
            <path d="M11 18a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" fill="currentColor" />
            <path d="M5 12l14 0" />
          </svg>
        </div>
        <div class="btn" id="seven">7</div>
        <div class="btn" id="eight">8</div>
        <div class="btn" id="nine">9</div>
        <div class="btn b2" id="multiply">X</div>
        <div class="btn" id="four">4</div>
        <div class="btn" id="five">5</div>
        <div class="btn" id="six">6</div>
        <div class="btn b2" id="minus">-</div>
        <div class="btn" id="one">1</div>
        <div class="btn" id="two">2</div>
        <div class="btn" id="three">3</div>
        <div class="btn b2" id="plus">+</div>
        <div class="btn" id="plusmulti">+/-</div>
        <div class="btn" id="zero">0</div>
        <div class="btn" id="dot">.</div>
        <div class="btn b2" id="equal">=</div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
