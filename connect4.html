<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Компьютерийн эсрэг тоглох Connect Four хөтөч тоглоом"
    />
    <title>Connect Four</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style4.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <h1>CONNECT <span>FOUR</span></h1>
        </div>
        <button class="reset-button" id="reset-game" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.68M20 4v4.68h-4.68" />
          </svg>
          Шинэ тоглоом
        </button>
      </header>

      <section class="game-layout" aria-label="Connect Four тоглоом">
        <aside class="player-card human" aria-label="Тоглогчийн оноо">
          <div class="token token-red" aria-hidden="true"></div>
          <div class="player-copy">
            <p class="player-name">Тоглогч</p>
            <p class="score"><strong id="player-score">0</strong> хожил</p>
          </div>
          <span class="turn-label" id="player-turn">Таны ээлж</span>
        </aside>

        <section class="board-section">
          <p class="status" id="status" role="status" aria-live="polite">
            Баганаа сонгоод эхлээрэй
          </p>
          <div class="board-wrap">
            <div
              class="board"
              id="board"
              role="grid"
              aria-label="6 мөр, 7 баганатай Connect Four самбар"
            ></div>
          </div>
          <p class="hint">Багана дээр дарна уу · Keyboard: 1–7</p>
        </section>

        <aside class="player-card computer" aria-label="Компьютерийн оноо">
          <div class="token token-yellow" aria-hidden="true"></div>
          <div class="player-copy">
            <p class="player-name">Компьютер</p>
            <p class="score"><strong id="computer-score">0</strong> хожил</p>
          </div>
          <span class="turn-label" id="computer-turn">Хүлээж байна</span>
        </aside>
      </section>
    </main>

    <div class="dialog-backdrop" id="result-dialog" hidden>
      <section
        class="result-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="result-title"
      >
        <div class="result-token token" id="result-token" aria-hidden="true"></div>
        <p class="result-kicker">ТОГЛООМ ДУУСЛАА</p>
        <h2 id="result-title">Та хожлоо!</h2>
        <p id="result-message">Гайхалтай тоглолт байлаа.</p>
        <button id="play-again" type="button">Дахин тоглох</button>
      </section>
    </div>

    <script src="script4.js"></script>
  </body>
</html>
