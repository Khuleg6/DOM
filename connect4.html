<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2 тоглогчийн Connect Four тоглоом" />
    <title>Connect Four</title>
    <link rel="stylesheet" href="style4.css" />
  </head>
  <body>
    <main class="game">
      <h1>Connect Four</h1>

      <div class="players">
        <div class="player active" id="player-one-card">
          <span class="small-token red-token"></span>
          <div>
            <strong>Тоглогч 1</strong>
            <p><span id="player-one-score">0</span> хожил</p>
          </div>
        </div>

        <div class="player" id="player-two-card">
          <span class="small-token yellow-token"></span>
          <div>
            <strong>Тоглогч 2</strong>
            <p><span id="player-two-score">0</span> хожил</p>
          </div>
        </div>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">
        Тоглогч 1-ийн ээлж
      </p>

      <div class="board" id="board" role="grid" aria-label="Connect Four самбар"></div>

      <p class="help">Багана дээр дарна уу. Keyboard ашиглавал 1–7 дарж болно.</p>
      <button id="new-game" class="new-game" type="button">Дахин эхлэх</button>
    </main>

    <div class="result" id="result" hidden>
      <div class="result-box" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <h2 id="result-title">Тоглогч 1 хожлоо!</h2>
        <button id="play-again" type="button">Дахин тоглох</button>
      </div>
    </div>

    <script src="script4.js"></script>
  </body>
</html>
