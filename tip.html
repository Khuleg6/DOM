<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style2.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
  </head>
  <body>
    <div class="header">
      <h1>Tip Calculator</h1>
    </div>
    <div class="frame">
      <p>Bill</p>
      <div class="sec1">
        <input class="input" type="text" placeholder="₮" id="bill-Input" />
      </div>
      <p>Select Tip %</p>
      <div class="sec2">
        <div class="grid" id="tips">
          <button>5%</button>
          <button>10%</button>
          <button>15%</button>
          <button>25%</button>
          <button>35%</button>
          <button>50%</button>
          <button>65%</button>
          <button>80%</button>
        </div>
      </div>
      <p id="total">0.00</p>
      <div class="sec3">
        <button class="reset" id="reset">Reset</button>
      </div>
    </div>
    <script src="./script2.js"></script>
  </body>
</html>
